{{- if .Values.cleanup.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cleanup-ephemeral-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cleanup-ephemeral-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
- apiGroups: ["external-secrets.io"]
  resources: ["externalsecrets"]
  verbs: ["get", "list", "delete"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cleanup-ephemeral-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cleanup-ephemeral-secrets
subjects:
- kind: ServiceAccount
  name: cleanup-ephemeral-secrets
  namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cleanup-ephemeral-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: {{ .Values.cleanup.activeDeadlineSeconds }}
  template:
    spec:
      serviceAccountName: cleanup-ephemeral-secrets
      restartPolicy: Never
      containers:
      - name: cleanup
        image: {{ .Values.cleanup.image }}
        command:
        - /bin/bash
        - -ce
        - |
          LABEL="{{ .Values.cleanup.label }}"
          NS="{{ .Release.Namespace }}"

          ES_COUNT=$(oc get externalsecret -l "${LABEL}=one-shot" -n "${NS}" --no-headers 2>/dev/null | wc -l)
          if [ "${ES_COUNT}" -eq 0 ]; then
            echo "No one-shot ExternalSecrets found."
          else
            echo "Found ${ES_COUNT} one-shot ExternalSecret(s)."

            echo "Waiting for ExternalSecrets to sync..."
            oc wait externalsecret -l "${LABEL}=one-shot" -n "${NS}" \
              --for=condition=Ready --timeout=90s 2>/dev/null || \
              echo "WARNING: Timed out waiting for Ready, proceeding."

            echo "Stripping ownerReferences from target Secrets..."
            for SECRET in $(oc get externalsecret -l "${LABEL}=one-shot" -n "${NS}" \
              -o jsonpath='{range .items[*]}{.spec.target.name}{"\n"}{end}'); do
              if oc get secret "${SECRET}" -n "${NS}" > /dev/null 2>&1; then
                oc patch secret "${SECRET}" -n "${NS}" --type json \
                  -p '[{"op":"remove","path":"/metadata/ownerReferences"}]' 2>/dev/null || true
                echo "  Stripped ownerReferences from ${SECRET}"
              fi
            done

            echo "Deleting one-shot ExternalSecrets..."
            oc delete externalsecret -l "${LABEL}=one-shot" -n "${NS}" --ignore-not-found
          fi

          SEC_COUNT=$(oc get secret -l "${LABEL}=delete" -n "${NS}" --no-headers 2>/dev/null | wc -l)
          if [ "${SEC_COUNT}" -eq 0 ]; then
            echo "No ephemeral Secrets to clean up."
          else
            echo "Deleting ${SEC_COUNT} ephemeral Secret(s)..."
            oc delete secret -l "${LABEL}=delete" -n "${NS}" --ignore-not-found
          fi

          echo "Cleanup complete."
{{- end }}
