{{- if .Values.cleanup.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cleanup-ephemeral-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cleanup-ephemeral-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cleanup-ephemeral-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cleanup-ephemeral-secrets
subjects:
- kind: ServiceAccount
  name: cleanup-ephemeral-secrets
  namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cleanup-ephemeral-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: {{ .Values.cleanup.activeDeadlineSeconds }}
  template:
    spec:
      serviceAccountName: cleanup-ephemeral-secrets
      restartPolicy: Never
      containers:
      - name: cleanup
        image: {{ .Values.cleanup.image }}
        command:
        - /bin/bash
        - -ce
        - |
          LABEL="{{ .Values.cleanup.label }}={{ .Values.cleanup.labelValue }}"
          NS="{{ .Release.Namespace }}"

          COUNT=$(oc get secret -l "${LABEL}" -n "${NS}" --no-headers 2>/dev/null | wc -l)
          if [ "${COUNT}" -eq 0 ]; then
            echo "No ephemeral secrets found. Nothing to do."
            exit 0
          fi
          echo "Found ${COUNT} secret(s) marked for cleanup."

          oc delete secret -l "${LABEL}" -n "${NS}" --ignore-not-found
          echo "Cleanup complete."
{{- end }}
